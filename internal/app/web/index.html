<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Catherina</title><meta name="description" content="Catherina · Mengka NT 助手"><link rel="icon" href="./favicon.svg"><link rel="stylesheet" href="./app.css"></head>
<body>
 <section id="login" class="login-screen" hidden><form id="login-form" class="login-box"><div class="monogram"><img src="./favicon.svg" width="40" height="40" alt="Catherina"></div><p class="eyebrow">Catherina · Mengka NT</p><h1 id="login-title">登录管理页面</h1><p id="login-note">输入你的 Catherina 管理密码。</p><label>管理密码<input id="password" type="password" autocomplete="current-password" required minlength="8" maxlength="512"></label><button class="primary" type="submit">进入 Catherina</button><p id="login-error" class="error" role="alert"></p></form></section>
  <div id="workspace" class="workspace" hidden><a class="skip-link" href="#content">跳到主要内容</a>
  <aside><header class="brand"><span class="monogram"><img src="./favicon.svg" width="40" height="40" alt=""></span><div><strong>Catherina</strong><small>Mengka NT</small></div><button id="theme" class="icon-button" aria-label="切换明暗主题">◐</button></header>
   <div class="account-picker"><label for="account">当前账号</label><select id="account"><option value="">尚未连接萌卡</option></select><span id="connection" class="connection">等待连接</span></div>
   <nav id="nav" aria-label="页面"><button data-page="overview">总览</button><button data-page="access">全局设置</button><button data-page="features">功能与指令</button><button data-page="menus">共用菜单</button><button data-page="library">问答与白名单</button><button data-page="jobs">自动任务</button><button data-page="settings">账号设置</button><button data-page="service">连接与更新</button><button data-page="debug">接口调试</button><button data-page="monitor">监控记录</button></nav><label class="mobile-nav" for="mobile-page">页面<select id="mobile-page"></select></label>
   <footer class="sidebar-footer"><span>全部功能免费</span><span id="version"></span><button id="logout" class="text-button">退出管理登录</button></footer>
  </aside>
   <main><div id="preview-banner" class="preview-banner" hidden>界面预览 · 示例 QQ · 配置单独保存</div><header class="account-strip" aria-label="账号状态"><div><span class="account-label">当前 QQ</span><strong id="current-account-number">尚未选择 QQ</strong><span id="current-account-client"></span></div><span id="current-account-state" class="account-state">等待账号</span></header><header class="page-header"><div><p class="eyebrow" id="page-kicker">Catherina</p><h1 id="page-title">总览</h1><p id="page-note"></p></div><div class="header-actions"><button id="reload">重新读取</button><button id="save" class="primary" hidden>保存修改</button></div></header><div id="policy-banner" class="notice" role="status" hidden></div><div id="content" tabindex="-1"></div><footer class="status-line"><span id="status">正在读取</span><span>全局设置共用 · 账号配置分别保存</span></footer></main>
 </div>
 <div id="toast" class="toast" role="status" aria-live="polite" hidden></div><dialog id="dialog"><form method="dialog" id="dialog-form"><div class="dialog-head"><h2 id="dialog-title"></h2><button id="dialog-close" class="icon-button" type="button" aria-label="关闭">×</button></div><div id="dialog-fields"></div><p id="dialog-error" class="inline-error" role="alert" hidden></p><div class="dialog-actions"><button id="dialog-cancel" type="button">取消</button><button id="dialog-ok" class="primary" type="submit">保存</button></div></form></dialog>
 <dialog id="announcement-dialog"><div class="dialog-head"><h2 id="announcement-title"></h2><button id="announcement-close" type="button" class="icon-button" aria-label="关闭公告">×</button></div><p id="announcement-body" class="announcement-body"></p><div class="dialog-actions"><button id="announcement-ok" class="primary">知道了</button></div></dialog><script src="./app.js" defer></script>
</body></html>
